name: Windows desktop download

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-desktop.yml"
      - "desktop/**"
      - "scripts/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - ".nvmrc"
      - "tests/desktop.test.mjs"

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check types and authorization logic
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
      - name: Build portable Windows app
        run: npm run desktop:package
      - name: Extract the downloadable archive
        run: |
          $archive = Get-ChildItem release/Relaywork-*-windows-x64.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath release/download-test -Force
      - name: Test the actual packaged executable
        env:
          RELAYWORK_DESKTOP_EXECUTABLE: ${{ github.workspace }}\release\download-test\Relaywork-win32-x64\relaywork.exe
        run: npm run test:desktop
      - name: Record application version
        id: version
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: Relaywork-Windows-x64
          path: |
            release/Relaywork-*-windows-x64.zip
            release/Relaywork-*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

  download:
    name: Publish tested Windows download
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Relaywork-Windows-x64
          path: release
      - name: Make the Windows archive downloadable
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="windows-desktop-v${VERSION}-${GITHUB_SHA:0:7}"
          archive="release/Relaywork-${VERSION}-windows-x64.zip"
          (cd release && sha256sum --check "Relaywork-${VERSION}-windows-x64.zip.sha256")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" "$archive.sha256" --clobber
          else
            gh release create "$tag" "$archive" "$archive.sha256" \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Relaywork ${VERSION} — Windows desktop demo" \
              --notes-file desktop/WINDOWS-DOWNLOAD.md
          fi
          printf '### Windows download\n\nhttps://github.com/%s/releases/download/%s/Relaywork-%s-windows-x64.zip\n' "$GITHUB_REPOSITORY" "$tag" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
